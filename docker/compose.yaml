name: haramain-test
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file:
      - db.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - database:/var/lib/mysql
      - ../public_html/localhost.sql:/docker-entrypoint-initdb.d/01-original.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  database:
