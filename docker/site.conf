<VirtualHost *:80>
    ServerName 45.133.251.252
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <LocationMatch "(?i)^/(system|sql|tests|tools|lk|catalog/model-)(/|$)">
        Require all denied
    </LocationMatch>

    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    <FilesMatch "(?i)(^config\.php$|^full\.php$|^mail_test\.php$|^phpinfo\.php$|\.(sql|md|log|ini|bak|old|zip|gz|tar|env)$)">
        Require all denied
    </FilesMatch>

    <Directory /var/www/html/image>
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
